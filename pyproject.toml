[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chroma-cli"
version = "0.1.0"
description = "Extract a color palette from any image — instant HEX, CSS, Tailwind."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["color", "palette", "cli", "design", "image", "tailwind", "css"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/stix2112333-stack/chroma-cli"
Issues = "https://github.com/stix2112333-stack/chroma-cli/issues"

[project.scripts]
chroma = "chroma_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
